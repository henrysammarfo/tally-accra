### Idempotent ledger of client offline mutations already accepted.
class: SyncedMutation
table: synced_mutation
fields:
  id: UuidValue?, defaultPersist=random_v7
  organizationId: UuidValue, relation(parent=organization, onDelete=Cascade)
  clientMutationId: String
  depositId: UuidValue?
  createdAt: DateTime, defaultModel=now
indexes:
  synced_mutation_org_client_idx:
    fields: organizationId, clientMutationId
    unique: true
