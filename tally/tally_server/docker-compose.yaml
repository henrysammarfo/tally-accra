services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: tally
      POSTGRES_PASSWORD: "uotvNOk-yBsLBOGEB2nEn79JZInDil0B"
    volumes:
      - tally_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "O057M33-kuFAl39hNN6J--8ViDAO5QfJ"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: tally_test
      POSTGRES_PASSWORD: "W91AvzfCL2QiVHANQ7sA6FJW5ylcCDhh"
    volumes:
      - tally_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "UljrUXLVf0XvzAKzxp4xqpe0INQGMoBi"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  tally_data:
  tally_test_data:
